name: Build Windows MVP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: windows-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  WINDOWS_SDK_VERSION: '10.0.26100.4948'
  WINDOWS_APP_SDK_VERSION: '1.8.260317003'

jobs:
  build:
    name: Build Intento x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET toolchain
        shell: pwsh
        run: |
          dotnet --info
          dotnet --version

      - name: Restore
        run: dotnet restore Intento.sln --locked-mode

      - name: Build Release x64
        run: >-
          dotnet build Intento.sln
          -c Release
          -p:Platform=x64
          --no-restore
          -warnaserror

      - name: Publish x64 self-contained
        run: >-
          dotnet publish src/Intento.App/Intento.App.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/Intento-win-x64

      - name: Validate deployment
        shell: pwsh
        run: |
          $exe = Join-Path $pwd 'artifacts/Intento-win-x64/Intento.App.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path artifacts/Intento-win-x64 -Filter *.exe -File |
              Where-Object { $_.Name -notmatch 'uninstall|setup|bootstrapper' } |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }
          if (-not $exe) {
            throw 'No application executable was produced by dotnet publish.'
          }
          Copy-Item $exe 'artifacts/Intento-win-x64/Intento.exe' -Force
          Get-Item 'artifacts/Intento-win-x64/Intento.exe' | Format-List FullName,Length,LastWriteTime
          Get-ChildItem 'artifacts/Intento-win-x64' -File | Select-Object Name,Length

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'artifacts/Intento-win-x64/*' -DestinationPath 'artifacts/Intento-win-x64.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Intento-win-x64
          path: artifacts/Intento-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "mvp-$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag `
            artifacts/Intento-win-x64.zip `
            --title "Intento MVP $tag" `
            --target $env:GITHUB_SHA `
            --generate-notes
